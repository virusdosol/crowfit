 if(blocked){banner("Dados não carregados: nada será salvo até você restaurar um backup ou começar do zero.");return false}
 /* Conquistas: checadas a cada gravação (treino, noz, trilha). Novas conquistas disparam window.onAchievement(eventos), se existir. Pendentes ficam no estado (CF.achPendingEvents / CF.achAck). */
 try{var ev=CF.unlockAchievements(S,today(),new Date().toISOString());if(ev.length&&typeof window.onAchievement==="function")window.onAchievement(ev)}catch(e){console.error("conquistas",e)}
 try{var k=CFStore.key(curUid),js=JSON.stringify(S);localStorage.setItem(k,js);if(localStorage.getItem(k)!==js)throw new Error("a verificação da gravação falhou");banner("");if(window.CFSync)CFSync.notify("save");return true}
 catch(e){console.error("Crowfit: falha ao salvar",e);banner("Alterações NÃO salvas ("+(e&&e.name==="QuotaExceededError"?"armazenamento cheio":"erro de gravação")+"). Exporte um backup.");return false}}
function persist(){var a=S.active,ex=a&&a.exercises[a.exIdx];if(ex&&ex.timer)CF.timerTick(ex.timer,Date.now());return save()}
/* Ao carregar/importar: cada cronômetro "running" é fechado com base em endAt. Se ainda resta tempo, pausa e preserva o restante;
   se acabou, conclui (remaining=0, endAt=null). Descanso concluído é liberado como no loop(). Não concede pontos. */
function pauseActive(){var now=Date.now();S.active.exercises.forEach(function(e){var t=e.timer;if(!t||t.state!=="running")return;
 CF.timerTick(t,now);
 if(t.state==="time_completed"){t.remaining=0;t.endAt=null;if(t.kind==="rest"){e.restPending=false;e.timer=null}}
 else CF.timerPause(t,now);
 CF.syncStatus(e)})}
window.addEventListener("error",function(e){console.error("Crowfit:",e.error||e.message);banner("Ocorreu um erro inesperado. Recarregue a página; seus dados salvos não foram apagados.")});

/* ---------- Conta ativa: entrar, sair e trocar ---------- */
/* Só carrega dados depois de saber o UID. Eventos da mesma conta (renovação de token etc.) são ignorados. */
function boot(snap){
 if(!snap||!snap.ready)return;
 var uid=snap.user?snap.user.id:(snap.offline?(snap.offlineUid||""):""),tag=uid||(snap.offline?"~offline":"~none");
 if(tag===booted)return;
 leave();booted=tag;
 if(!uid){if(tag==="~offline")view('<div class="hero"><h1>Não foi possível identificar a conta</h1><p>Conecte-se à internet e entre de novo. Seus dados continuam guardados neste aparelho.</p></div>');return}
 if(!CFStore.uidOk(uid)){view('<div class="hero"><h1>Conta não reconhecida</h1><p>Entre novamente.</p></div>');return}
 curUid=uid;enter(uid)}
/* Sai da conta atual: grava o que é dela na partição dela, invalida tarefas pendentes e limpa a memória e a tela. Nada persistido é apagado. */
function leave(){
 if(S&&curUid&&!blocked)save();
 gen++;if(window.CFSync)CFSync.reset();S=null;curUid="";ob={step:0,d:{}};loadErr=null;blocked=false;rawBad=null;bakOk=false;homeStale=false;
 clearInterval(tm);banner("");app.innerHTML="";say("")}
function legacyValid(raw){try{return CF.validateState(JSON.parse(raw)).ok}catch(e){return false}}
function enter(uid){var st=load(uid);
 if(loadErr&&blocked){renderRecovery();return}
 if(st==="empty"&&CFStore.legacyStatus(LS(),uid,legacyValid)==="offer"){S=null;renderAdopt(uid);return} /* S nulo: nada pode ser gravado enquanto a decisão está pendente */
 S.profile?renderHome():renderOb();if(window.CFSync)CFSync.notify("login",true)}

function renderAdopt(uid){var my=gen,old=null;try{old=JSON.parse(localStorage.getItem(CFStore.LEGACY))}catch(e){}

  if(r.ok){enter(uid);return}

  enter(uid)};

/* ---------- Backup ---------- */
function exportText(t,name){var b=new Blob([t],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
/* A importação vale só para a conta que estava ativa ao escolher o arquivo; se a conta mudar, o resultado é descartado. */
function pickImport(onDone){var my=gen,uid=curUid;if(!uid)return;var i=document.createElement("input");i.type="file";i.accept="application/json,.json";i.onchange=function(){var f=i.files[0];if(!f)return;if(f.size>1000000){alert("Arquivo grande demais (máximo 1 MB).");return}
 var rd=new FileReader();rd.onerror=function(){alert("Não foi possível ler o arquivo.")};rd.onload=function(){if(my!==gen)return;var r=CF.parseBackup(String(rd.result));if(!r.ok){alert("Backup recusado:\n- "+r.errors.slice(0,5).join("\n- ")+"\n\nNenhum dado foi alterado.");return}
  if(!confirm("Substituir os dados desta conta pelo backup? Uma cópia dos dados atuais será guardada neste aparelho."))return;
  if(my!==gen)return;
  try{localStorage.setItem(CFStore.key(uid)+":antes-importar",JSON.stringify(S))}catch(e){}
  S=r.state;blocked=false;loadErr=null;if(S.active)pauseActive();save();homeStale=false;if(onDone)onDone();S.profile?renderHome():renderOb()};rd.readAsText(f)};i.click()}
function renderRecovery(){view('<div class="hero"><h1>Não consegui carregar seus dados</h1><p>'+(bakOk?"Seus dados originais foram preservados e não foram apagados.":"Seus dados originais ainda não foram apagados, mas não coube uma cópia de segurança neste aparelho. Baixe a cópia abaixo antes de qualquer outra ação.")+'</p></div><div class="card"><b>O que foi encontrado:</b><ul>'+loadErr.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul></div><div class="row"><button class="btn" id="im">Restaurar de um backup</button></div><div class="row"><button class="btn sec" id="ex">Baixar cópia dos dados antigos</button></div><button class="link" id="fr">Começar do zero (a cópia antiga fica guardada)</button>');
 $("im").onclick=function(){pickImport()};$("ex").onclick=function(){exportText(rawBad||"","crowfit-dados-antigos.json")};
 $("fr").onclick=function(){if(confirm(bakOk?"Começar do zero? Os dados antigos continuam guardados em uma cópia neste aparelho.":"ATENÇÃO: não foi possível guardar uma cópia dos dados antigos neste aparelho. Se continuar, eles serão apagados. Use antes \"Baixar cópia dos dados antigos\". Começar do zero mesmo assim?")){blocked=false;loadErr=null;S=CF.emptyState();save();renderOb()}}}

function ofClick(e){var b=e.target.closest&&e.target.closest("[data-nav],[data-ds]");if(!b)return;
 if(b.hasAttribute("data-nav")){var mm=OF.m+(+b.getAttribute("data-nav"));OF.y+=Math.floor(mm/12);OF.m=((mm%12)+12)%12;}
 else OF.sel=b.getAttribute("data-ds");
 $("of-cal").innerHTML=ofCal(today())+nozHTML(today());
 if(!b.hasAttribute("data-nav")){var n=$("of-cal").querySelector('[data-ds="'+OF.sel+'"]');if(n)n.focus({preventScroll:true})}
 else{var nb=$("of-cal").querySelector('[data-nav="'+b.getAttribute("data-nav")+'"]');if(nb)nb.focus({preventScroll:true})}}
function renderOfensivas(){var t=today();OF=null;var b4=S.streak+"/"+S.best;CF.refreshStreak(S,t);if(b4!==S.streak+"/"+S.best)save();var n=S.streak;
 view('<div class="of-wrap">'+
 '<div class="of-top"><button type="button" class="of-x" id="of-bk" aria-label="Voltar para a trilha"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 3l16 16M19 3L3 19" stroke="#17171C" stroke-width="2.6" stroke-linecap="round"/></svg></button><img class="of-logo" src="logo-dark.png" alt="Crowfit"><span class="of-sp"></span></div>'+
 '<div class="of-hero"><div class="of-l"><div class="of-num">'+n+'</div><div class="of-txt">dias de ofensiva!</div><svg class="of-u" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M6 10Q150 2 294 8"/></svg></div><div class="of-r"><img class="of-f" src="flame.png" alt=""><span class="of-sh" aria-hidden="true"></span></div></div>'+
 '<div class="of-tt"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="5" width="24" height="21" rx="4" fill="none" stroke="#17171C" stroke-width="2.4"/><path d="M2 11h24" stroke="#E3182D" stroke-width="5"/><path d="M9 2v5M19 2v5" stroke="#17171C" stroke-width="2.4" stroke-linecap="round"/><g fill="#17171C"><circle cx="8" cy="16" r="1.3"/><circle cx="14" cy="16" r="1.3"/><circle cx="20" cy="16" r="1.3"/><circle cx="8" cy="21" r="1.3"/><circle cx="14" cy="21" r="1.3"/><circle cx="20" cy="21" r="1.3"/></g></svg><h2>Calendário da ofensiva</h2></div>'+
 '<div id="of-cal">'+ofCal(t)+nozHTML(t)+'</div></div>');
 $("of-bk").onclick=renderHome;$("of-cal").onclick=ofClick}

/* ---------- Configurações (renderizadas dentro do painel de perfil, categorias "Perfil de treino" e "Dados e backup") ---------- */
function secTrain(host,a){var p=S&&S.profile;
 if(!p){host.innerHTML='<p class="tip">Esta conta ainda não tem perfil de treino. Ele é criado no primeiro acesso.</p>';return}
 var d={exp:p.exp,dias:p.dias};
 function fld(id,lab,type,val,ex){return'<div class="cf-field"><label for="'+id+'">'+lab+'</label><input id="'+id+'" type="'+type+'" value="'+CF.escAttr(val)+'" '+ex+'></div>'}
 function chips(lab,id,at,list,cur){return'<div class="cf-field"><label id="'+id+'">'+lab+'</label><div class="chips" role="group" aria-labelledby="'+id+'">'+list.map(function(o){return'<button type="button" class="chip" '+at+'="'+CF.escAttr(o)+'" aria-pressed="false">'+esc(o)+'</button>'}).join("")+'</div></div>'}
 host.innerHTML='<form class="cf-form" novalidate id="tf">'+fld("tf-n","Nome","text",p.nome,'maxlength="40" autocomplete="given-name"')+fld("tf-i","Idade","number",p.idade,'inputmode="numeric" min="12" max="90"')+fld("tf-p","Peso (kg)","number",p.peso,'inputmode="decimal" step="any" min="30" max="250"')+fld("tf-h","Altura (cm)","number",p.altura,'inputmode="decimal" step="any" min="120" max="230"')+
  chips("Experiência com exercícios","tf-el","data-e",CF.EXP)+chips("Dias de treino por semana","tf-dl","data-d",[3,4,5,6])+
  '<p class="cf-msg" role="status" aria-live="polite" id="tf-m" hidden></p><button class="cf-btn cf-btn-main" type="submit">Salvar alterações</button></form>'+
  '<p class="cf-hint">Editar não apaga pontos, histórico, ofensiva nem a trilha. A experiência vale a partir da próxima seção da trilha; os dias por semana valem a partir de hoje.</p>'+
  '<button class="cf-btn cf-btn-ghost" type="button" id="tf-r">Refazer perfil e plano</button>';
 function mark(sel,at,val){host.querySelectorAll(sel).forEach(function(c){var on=c.getAttribute(at)===String(val);c.classList.toggle("on",on);c.setAttribute("aria-pressed",on?"true":"false")})}
 function m(t,ok){var n=host.querySelector("#tf-m");n.textContent=t||"";n.className="cf-msg "+(ok?"ok":"error");n.hidden=!t}
 mark("[data-e]","data-e",d.exp);mark("[data-d]","data-d",d.dias);
 host.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){d.exp=b.getAttribute("data-e");mark("[data-e]","data-e",d.exp)}});
 host.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){d.dias=Number(b.getAttribute("data-d"));mark("[data-d]","data-d",d.dias)}});
 host.querySelector("#tf").onsubmit=function(e){e.preventDefault();
  var g=function(id){return host.querySelector(id).value.trim()};
  var r=CF.validateProfile({nome:g("#tf-n"),idade:Number(g("#tf-i")),peso:Number(g("#tf-p")),altura:Number(g("#tf-h")),exp:d.exp,dias:d.dias});
  if(!r.ok){m(r.errors[0]);return}
  var old=S.profile,ph=JSON.stringify(S.planHistory),t=today();
  S.profile=r.profile;if(r.profile.dias!==old.dias)CF.setPlan(S,r.profile.dias,t);CF.refreshStreak(S,t);
  if(!save()){S.profile=old;S.planHistory=JSON.parse(ph);CF.refreshStreak(S,t);m("Não foi possível salvar. Nada foi alterado.");return}
  homeStale=true;m("Alterações salvas.",true)};
 host.querySelector("#tf-r").onclick=function(){
  if(S.active){alert("Termine ou abandone o treino em andamento antes de refazer o plano.");return}
  if(!confirm("Refazer o perfil? Seus pontos, histórico, ofensiva e trilha são mantidos."))return;
  var old=S.profile;S.profile=null;if(!save()){S.profile=old;alert("Não foi possível salvar. Nada foi alterado.");return}
  ob={step:0,d:{}};homeStale=false;a.close();renderOb()}}
function secData(host,a){
 host.innerHTML='<div class="card"><b>O que o backup inclui</b><ul class="cf-ul"><li>Perfil de treino (nome, idade, peso, altura, experiência e dias por semana)</li><li>Pontos, nível e ofensiva</li><li>Histórico de treinos e de planos</li><li>Progresso da trilha</li><li>Ajuste de dificuldade</li></ul><p class="tip" style="margin:8px 0 0">Não inclui e-mail, senha nem o nome de exibição da conta. O arquivo tem dados pessoais: guarde com cuidado.</p></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn sec" type="button" id="d-x">Exportar backup</button></div><div class="row"><button class="btn sec" type="button" id="d-i">Importar backup</button></div>'+
  '<p class="cf-hint">Importar substitui os dados desta conta neste aparelho. Antes de substituir, pedimos confirmação e guardamos uma cópia dos dados atuais.</p>';
 host.querySelector("#d-x").onclick=function(){if(S)exportText(CF.makeBackup(S),"crowfit-backup-"+today()+".json")};
 host.querySelector("#d-i").onclick=function(){pickImport(function(){a.close()})}}

/* ---------- Treino ---------- */
function buildSession(type,lv){return SES[type].ex.map(function(k){var parts=k.split("|"),id=parts.length>1&&lv>=1?parts[1]:parts[0],e=EX[id],opt=(id==="po"||id==="al");
 return{id:id,n:e.n,t:e.t,val:e.v[lv],optional:opt,sets:opt?1:(lv===0?2:3),rest:lv===0?30:45}})}
function startSession(type){var lv=CF.levelFor(S.profile,S.adjust),t=today();S.active=CF.newSession(type,buildSession(type,lv),t,Date.now(),S.profile.dias,!!S.done[t]);save();renderEx()}
function cur(){var a=S.active;return a&&a.exercises[a.exIdx]}
function renderEx(){var a=S.active,ex=cur();if(!ex){finish();return}CF.syncStatus(ex);
 var pct=Math.round(a.exIdx/a.exercises.length*100),tip=EX[ex.exerciseId]?EX[ex.exerciseId].tip:"",T=ex.timer,n=ex.setIdx+1;
 var chips=ex.sets.map(function(s,i){var c=s.completed?" ok":(i===ex.setIdx&&!ex.restPending?" cur":"");return'<span class="sp'+c+'">'+(s.completed?"✓ ":"")+'Série '+(i+1)+'</span>'}).join("");
 var h='<div class="row" style="align-items:center;margin:0 0 20px"><button class="chip" id="x" aria-label="Sair do treino">✕</button><div class="bar" style="flex:1" role="img" aria-label="Progresso do treino"><i style="width:'+pct+'%"></i></div></div>';
 h+='<div class="card center pop"><div>'+mascote(70)+'</div><h2 style="margin-top:10px">'+esc(ex.name)+'</h2><p class="tip" style="margin:6px 0">Exercício '+(a.exIdx+1)+' de '+a.exercises.length+(ex.optional?" · opcional":"")+(a.extra?" · sessão extra":"")+'</p><div class="sets">'+chips+'</div>';
 if(ex.restPending){var rt=T&&T.kind==="rest";
  h+='<p><b>Descanso</b> antes da série '+n+' de '+ex.sets.length+'</p><div class="big" id="tg">'+(rt?CF.timerSecs(T):ex.rest)+'s</div>';
  if(!rt)h+='<button class="btn" id="rst">Iniciar descanso</button>';
  else h+='<button class="btn sec" id="'+(T.state==="paused"?"rsm":"pse")+'">'+(T.state==="paused"?"Retomar":"Pausar")+'</button>';
  h+='<button class="link" id="rsk" style="margin-top:14px">Pular descanso</button>'}
 else{h+='<p><b>Série '+n+' de '+ex.sets.length+'</b></p>';
  if(ex.kind==="s"){var st=T?T.state:"idle";h+='<div class="big" id="tg">'+(T?CF.timerSecs(T):ex.target)+'s</div>';
   if(st==="idle")h+='<button class="btn" id="ts">Iniciar série ('+ex.target+'s)</button>';
   else if(st==="running")h+='<button class="btn sec" id="pse">Pausar</button>';
   else if(st==="paused")h+='<button class="btn sec" id="rsm">Retomar</button>';
   h+='<button class="btn" id="ok" style="margin-top:12px" '+(st==="time_completed"?"":"disabled")+'>Concluir série '+n+' (+10 ao fim)</button>'}
  else h+='<div class="big">'+ex.target+' repetições</div><p class="tip">'+esc(tip)+'</p><button class="btn" id="ok">Concluí a série '+n+'</button>';
  if(ex.kind==="s")h+='<p class="tip">'+esc(tip)+'</p>';
  h+='<button class="link" id="sk" style="margin-top:14px">Pular exercício</button>'}
 h+='<p class="tip" style="font-size:13px">Sentiu dor ou tontura? Pare e procure orientação profissional.</p></div>';
 view(h);
 var B=function(id,f){var e=$(id);if(e)e.onclick=function(){if(act())f()}};
 B("x",function(){if(confirm("Sair e continuar depois? Seu progresso fica salvo.")){a.status="interrupted";persist();renderHome()}});
 B("ts",function(){ex.timer=CF.timerStart(ex.target,"work",Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("pse",function(){CF.timerPause(ex.timer,Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("rsm",function(){CF.timerResume(ex.timer,Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("rst",function(){ex.timer=CF.timerStart(ex.rest,"rest",Date.now());persist();renderEx()});
 B("rsk",function(){ex.restPending=false;ex.timer=null;CF.syncStatus(ex);persist();say("Descanso pulado");renderEx()});
 B("ok",function(){var r=CF.completeSet(a,Date.now());if(!r.ok){say("Não foi possível concluir a série: "+({timer:"termine o tempo primeiro",rest:"faça o descanso ou pule-o"}[r.reason]||"ação inválida"));renderEx();return}
  if(r.exerciseDone){var p=CF.grantExercise(S,a,ex);say("Exercício concluído"+(p?". +"+p+" pontos":". Sem novos pontos"));next()}else{persist();say("Série concluída");renderEx()}});
 B("sk",function(){CF.skipExercise(a);say("Exercício pulado");next()});
 if(T&&T.state==="running")loop()}
function next(){var fin=CF.advance(S.active);persist();fin?finish():renderEx()}
function loop(){clearInterval(tm);var g0=gen;tm=setInterval(function(){if(g0!==gen||!S){clearInterval(tm);return}var ex=cur();if(!ex||!ex.timer||ex.timer.state!=="running")return;CF.timerTick(ex.timer,Date.now());
 if(ex.timer.state==="time_completed"){clearInterval(tm);if(ex.timer.kind==="rest"){ex.restPending=false;ex.timer=null;say("Descanso terminado")}else say("Tempo concluído. Conclua a série.");CF.syncStatus(ex);persist();renderEx()}
 else{var g=$("tg");if(g)g.textContent=CF.timerSecs(ex.timer)+"s"}},250)}
function finish(){var a=S.active,st=CF.finishSession(S,a,Date.now(),today());S.active=null;save();var ok=st==="completed";
 view('<div class="hero pop">'+mascote(150)+'<h1>'+(ok?"Treino concluído!":"Treino encerrado")+'</h1><p>'+(ok?"Você completou todos os exercícios obrigatórios.":"Há exercícios obrigatórios pendentes: sem bônus de treino completo e o dia não conta para a ofensiva.")+'</p></div><div class="card center"><div class="big" style="color:var(--gold)">+'+a.points+'</div><div>pontos nesta sessão'+(a.extra?" (sessão extra)":"")+'</div><div style="margin-top:14px;font-family:Fredoka;font-size:22px">🔥 Ofensiva: '+S.streak+(S.streak===1?" dia":" dias")+'</div></div>'+
 (ok?'<div class="card center" style="margin-top:14px"><b>Como foi o treino?</b><div class="chips" style="justify-content:center;margin-top:10px"><button class="chip" data-f="hard">Foi difícil</button><button class="chip" data-f="ok">No ponto</button><button class="chip" data-f="easy">Foi fácil</button></div><p class="tip" id="fm"></p></div>':"")+'<div style="margin-top:18px"><button class="btn" id="hm">Voltar ao plano</button></div>');
 document.querySelectorAll("[data-f]").forEach(function(c){c.onclick=function(){if(a.feedback)return;a.feedback=c.getAttribute("data-f");CF.applyFeedback(S,a.feedback);save();document.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===c);x.disabled=true});$("fm").textContent=a.feedback==="hard"?"Anotado. O próximo treino fica mais leve.":a.feedback==="easy"?"Anotado. Subimos a dificuldade depois de 3 treinos fáceis seguidos.":"Anotado."}});
 $("hm").onclick=renderHome}

/* ---------- Início ---------- */
/* Nada é carregado aqui: os dados só são lidos depois que a autenticação informa o UID (boot). */
if(window.CrowfitProfile){
 /* Perfil lê nível e XP daqui (mesma fonte da home: S.points e lvlInfo). Sem conta carregada, devolve null. */
 CrowfitProfile.setStats(function(){return S&&S.profile?{level:lvlInfo().l,points:S.points}:null});
 CrowfitProfile.setSections(function(name,host,api){if(!S)return;if(name==="train")secTrain(host,api);else if(name==="data")secData(host,api)});
 CrowfitProfile.setOnClose(function(){if(homeStale&&S&&S.profile){homeStale=false;renderHome()}})}
/* Sincronização (supabase-sync.js): só lê/grava a conta ativa; respostas atrasadas de outra conta são descartadas pela geração (gen). */
if(window.CFSync)CFSync.attach({state:function(){return S&&curUid&&!blocked?{S:S,uid:curUid,gen:gen}:null},save:save,today:today,
 changed:function(){if(S&&!S.profile&&ob&&window.CFSync&&CFSync.remoteSettings){var rs=CFSync.remoteSettings();if(rs){if(ob.d.exp===undefined)ob.d.exp=rs.exp;if(ob.d.dias===undefined)ob.d.dias=String(rs.dias);if(ob.started&&QS[ob.step]&&QS[ob.step].type==="chips")renderOb()}}if($("t-path"))renderHome()},
 status:function(s){if(s&&s.state==="error"){say("Sincronização: "+s.message);banner("Sincronização: "+s.message)}}});
if(window.CrowfitAuth){CrowfitAuth.onChange(boot);CrowfitAuth.init().then(function(){boot(CrowfitAuth.getState())})}
else view('<div class="hero"><h1>Não foi possível iniciar</h1><p>O módulo de acesso não carregou. Recarregue a página.</p></div>');
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(e){console.warn("Crowfit: service worker não registrado",e)})})}
</script>
