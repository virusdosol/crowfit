<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Crowfit</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
#splash{position:fixed;inset:0;z-index:100001;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
.pf{background:none;border:0;padding:4px;min-width:44px;min-height:44px;display:inline-grid;place-items:center;cursor:pointer;border-radius:14px;color:inherit}
.pf:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#080808;--card:#202020;--ink:#F5F5F5;--mute:#A9A9A9;--line:#333;--brand:#D92332;--brand-d:#9C1823;--gold:#F5F5F5;--ok:#D92332;--rest:#3A3A3A;--onbrand:#F5F5F5;--mbg:#F5F5F5;--linv:invert(1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.45 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;line-height:1.15}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.stat{display:flex;align-items:center;gap:6px;font-family:Fredoka;font-size:20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:800 16px Nunito;background:var(--brand);color:var(--onbrand);box-shadow:0 4px 0 var(--brand-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.sec{background:var(--card);color:var(--brand);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.node:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:14px}
input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:700 17px Nunito;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 14px;font:800 15px Nunito;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--onbrand)}
.hero{text-align:center;padding:10px 0 20px}
.mascot{object-fit:contain;display:inline-block;border-radius:24px;background:var(--mbg)}
.logo{display:block;margin:12px auto 0;width:min(260px,72%);height:auto;filter:var(--linv)}
.hero h1{font-size:30px;margin-top:8px}
.hero p{color:var(--mute);margin:6px 0 0}
.path{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;font:inherit;color:inherit;width:100%}
.node.today{border-color:var(--brand);box-shadow:0 4px 0 var(--brand-d)}
.node.today{cursor:pointer}
.dot{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--line);color:var(--mute)}
.today .dot{background:var(--brand);color:#F5F5F5}.done .dot{background:var(--ok);color:#F5F5F5}.rest .dot{background:var(--rest);color:#F5F5F5}
.node small{color:var(--mute);display:block;font-weight:700}
.node b{font-family:Fredoka;font-size:18px;font-weight:600}
.locked{opacity:.6}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .3s}
.big{font-family:Fredoka;font-size:64px;line-height:1;color:var(--brand);margin:8px 0}
.tip{color:var(--mute);margin:10px 0 18px}
.row{display:flex;gap:10px;margin-top:10px}
.center{text-align:center}
.week{display:flex;justify-content:space-between;margin:14px 0 4px}
.week span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--line);color:var(--mute)}
.week .d{background:var(--ok);color:#fff}.week .t{outline:3px solid var(--brand)}
.link{background:none;border:0;color:var(--mute);font:700 14px Nunito;text-decoration:underline;cursor:pointer;margin-top:24px;width:100%}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}}
.sets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.sp{border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:13px;color:var(--mute)}
.sp.cur{border-color:var(--brand);color:var(--ink)}.sp.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
#bn{position:fixed;left:0;right:0;top:0;z-index:20;background:#D92332;color:#F5F5F5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:center;font-size:14px}
#bn[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<link rel="stylesheet" href="profile.css">

</head>
<body>
<div id="splash" aria-hidden="true"><img src="splash.jpg" alt=""></div>
<script>
/* Splash: 1 s a partir de agora, depois some com fade. Só usa timer (não depende de login nem de rede), então nunca fica presa. */
(function(){var s=document.getElementById("splash");if(!s)return;var done=false;
function rm(){if(done)return;done=true;s.classList.add("out");setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},450)}
setTimeout(rm,1000);var i=s.querySelector("img");if(i)i.addEventListener("error",rm)})();
</script>
<div id="bn" role="alert" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="app"></div>
<!-- Autenticação (Supabase). O SDK carrega com async para não atrasar o app. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" async></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="auth-ui.js"></script>

<script src="core.js"></script>

<script>
function mascote(sz){sz=sz||96;return '<img class="mascot" src="mascot.png" height="'+sz+'" alt="Crowfit, o corvo mascote" style="height:'+sz+'px;width:auto">'}
var EX={
fl_j:{n:"Flexão com joelhos no chão",t:"r",v:[8,12,16],tip:"Corpo reto dos joelhos à cabeça. Desça até o peito quase tocar o chão."},
fl:{n:"Flexão de braço",t:"r",v:[6,12,20],tip:"Mãos na largura dos ombros, cotovelos a 45° do corpo."},
fl_d:{n:"Flexão diamante",t:"r",v:[4,8,14],tip:"Mãos juntas formando um diamante. Foco no tríceps."},
mg:{n:"Mergulho no sofá ou cadeira firme",t:"r",v:[6,10,15],tip:"Use um apoio estável. Desça dobrando os cotovelos para trás."},
pk:{n:"Flexão em pike",t:"r",v:[5,8,12],tip:"Quadril alto em V invertido. Desça a cabeça em direção ao chão."},
ag:{n:"Agachamento livre",t:"r",v:[12,20,30],tip:"Pés na largura dos ombros, peito aberto, joelhos alinhados com os pés."},
af:{n:"Afundo alternado",t:"r",v:[8,12,20],tip:"Passo longo à frente. O joelho de trás quase toca o chão."},
pg:{n:"Ponte de glúteos",t:"r",v:[12,18,25],tip:"Deitado, pés no chão. Suba o quadril e aperte o glúteo no topo."},
ag_s:{n:"Agachamento isométrico na parede",t:"s",v:[20,35,50],tip:"Costas na parede, coxas paralelas ao chão. Respire fundo."},
pa:{n:"Elevação de panturrilha",t:"r",v:[15,25,35],tip:"Suba nas pontas dos pés, devagar, e segure 1 segundo."},
ab:{n:"Abdominal tradicional",t:"r",v:[10,18,25],tip:"Mãos cruzadas no peito. Suba a escápula, sem puxar o pescoço."},
pr:{n:"Prancha",t:"s",v:[20,40,60],tip:"Cotovelos sob os ombros, abdômen firme, sem afundar o quadril."},
mc:{n:"Escalador (mountain climber)",t:"s",v:[20,30,45],tip:"Posição de flexão, traga os joelhos ao peito em ritmo constante."},
bi:{n:"Abdominal bicicleta",t:"r",v:[12,20,30],tip:"Cotovelo oposto ao joelho, movimento controlado."},
pe:{n:"Elevação de pernas",t:"r",v:[8,12,18],tip:"Deitado, pernas retas. Desça sem encostar os pés no chão."},
po:{n:"Polichinelo",t:"s",v:[30,45,60],tip:"Aquecimento ou cardio. Aterrisse macio."},
bu:{n:"Burpee",t:"r",v:[5,8,12],tip:"Agache, prancha, volte e salte. Vá no seu ritmo."},
al:{n:"Alongamento final",t:"s",v:[30,40,60],tip:"Respire devagar. Alongue peito, pernas e costas."}};
var SES={
P:{n:"Peito e braços",ex:["po","fl_j|fl","fl|fl_d","mg","pk","al"]},
L:{n:"Pernas e glúteos",ex:["po","ag","af","pg","ag_s","pa","al"]},
C:{n:"Abdômen e core",ex:["po","ab","pr","bi","pe","mc","al"]},
F:{n:"Corpo todo",ex:["po","ag","fl_j|fl","mc","pg","pr","bu|bi","al"]}};
var DIAS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
/* Dados por conta: cada conta usa "corvofit-v2:u:<UID>" (ver store.js).
   "corvofit-v1" é o nome histórico da chave antiga: NÃO renomear, NÃO apagar e NÃO escrever mais nela. Ela só é lida para a adoção única pelo dono. */
var S=null,curUid="",gen=0,booted=null,homeStale=false,loadErr=null,blocked=false,rawBad=null,bakOk=false,tm=null,lastAct=0,ob={step:0,d:{}};
var $=function(id){return document.getElementById(id)},app=$("app"),esc=CF.escText,today=function(){return CF.dateKey(new Date())};
function LS(){try{return window.localStorage}catch(e){return null}}
function say(t){var l=$("live");if(l)l.textContent=t}
function banner(m){var b=$("bn");if(b){b.textContent=m||"";b.hidden=!m}}
function act(){var n=Date.now();if(n-lastAct<350)return false;lastAct=n;return true}
function view(h){clearInterval(tm);app.innerHTML=h;var t=app.querySelector("h1,h2,.logo");if(t){t.setAttribute("tabindex","-1");try{t.focus({preventScroll:true})}catch(e){}}}

/* ---------- Persistência (partição da conta atual) ---------- */
/* Devolve "ok" (dados da conta lidos), "empty" (a conta ainda não tem dados) ou "unavail" (armazenamento indisponível). */
function load(uid){var raw=null,k=CFStore.key(uid);
 try{raw=localStorage.getItem(k)}catch(e){loadErr=["Armazenamento indisponível neste navegador."];S=CF.emptyState();banner("Armazenamento indisponível: seu progresso NÃO será salvo.");return"unavail"}
 if(raw==null){S=CF.emptyState();return"empty"}
 var o,r;try{o=JSON.parse(raw);r=CF.validateState(o)}catch(e){r={ok:false,errors:["O arquivo salvo está corrompido (JSON inválido)."]}}
 if(!r.ok){rawBad=raw;loadErr=r.errors.slice(0,6);blocked=true;S=CF.emptyState();try{localStorage.setItem(k+":corrompido",raw);bakOk=true}catch(e){console.error("Crowfit: não foi possível copiar os dados antigos",e)}console.error("Crowfit: dados locais inválidos",r.errors);return"ok"}
 S=r.state;if(S.active)pauseActive();return"ok"}
function save(){
 if(!S||!curUid)return false;
 if(blocked){banner("Dados não carregados: nada será salvo até você restaurar um backup ou começar do zero.");return false}
 try{var k=CFStore.key(curUid),js=JSON.stringify(S);localStorage.setItem(k,js);if(localStorage.getItem(k)!==js)throw new Error("a verificação da gravação falhou");banner("");return true}
 catch(e){console.error("Crowfit: falha ao salvar",e);banner("Alterações NÃO salvas ("+(e&&e.name==="QuotaExceededError"?"armazenamento cheio":"erro de gravação")+"). Exporte um backup.");return false}}
function persist(){var a=S.active,ex=a&&a.exercises[a.exIdx];if(ex&&ex.timer)CF.timerTick(ex.timer,Date.now());return save()}
/* Ao carregar/importar: cada cronômetro "running" é fechado com base em endAt. Se ainda resta tempo, pausa e preserva o restante;
   se acabou, conclui (remaining=0, endAt=null). Descanso concluído é liberado como no loop(). Não concede pontos. */
function pauseActive(){var now=Date.now();S.active.exercises.forEach(function(e){var t=e.timer;if(!t||t.state!=="running")return;
 CF.timerTick(t,now);
 if(t.state==="time_completed"){t.remaining=0;t.endAt=null;if(t.kind==="rest"){e.restPending=false;e.timer=null}}
 else CF.timerPause(t,now);
 CF.syncStatus(e)})}
window.addEventListener("error",function(e){console.error("Crowfit:",e.error||e.message);banner("Ocorreu um erro inesperado. Recarregue a página; seus dados salvos não foram apagados.")});

/* ---------- Conta ativa: entrar, sair e trocar ---------- */
/* Só carrega dados depois de saber o UID. Eventos da mesma conta (renovação de token etc.) são ignorados. */
function boot(snap){
 if(!snap||!snap.ready)return;
 var uid=snap.user?snap.user.id:(snap.offline?(snap.offlineUid||""):""),tag=uid||(snap.offline?"~offline":"~none");
 if(tag===booted)return;
 leave();booted=tag;
 if(!uid){if(tag==="~offline")view('<div class="hero"><h1>Não foi possível identificar a conta</h1><p>Conecte-se à internet e entre de novo. Seus dados continuam guardados neste aparelho.</p></div>');return}
 if(!CFStore.uidOk(uid)){view('<div class="hero"><h1>Conta não reconhecida</h1><p>Entre novamente.</p></div>');return}
 curUid=uid;enter(uid)}
/* Sai da conta atual: grava o que é dela na partição dela, invalida tarefas pendentes e limpa a memória e a tela. Nada persistido é apagado. */
function leave(){
 if(S&&curUid&&!blocked)save();
 gen++;S=null;curUid="";ob={step:0,d:{}};loadErr=null;blocked=false;rawBad=null;bakOk=false;homeStale=false;
 clearInterval(tm);banner("");app.innerHTML="";say("")}
function legacyValid(raw){try{return CF.validateState(JSON.parse(raw)).ok}catch(e){return false}}
function enter(uid){var st=load(uid);
 if(loadErr&&blocked){renderRecovery();return}
 if(st==="empty"&&CFStore.legacyStatus(LS(),uid,legacyValid)==="offer"){S=null;renderAdopt(uid);return} /* S nulo: nada pode ser gravado enquanto a decisão está pendente */
 S.profile?renderHome():renderOb()}
/* Dados antigos (sem dono) só passam para uma conta com confirmação explícita; depois disso não são oferecidos a nenhuma outra. */
function renderAdopt(uid){var my=gen,old=null;try{old=JSON.parse(localStorage.getItem(CFStore.LEGACY))}catch(e){}
 var nm=old&&old.profile&&typeof old.profile.nome==="string"?old.profile.nome:"",pts=old&&isFinite(old.points)?old.points:0;
 view('<div class="hero"><h1>Dados antigos encontrados</h1><p>Este aparelho tem um progresso do Crowfit salvo antes das contas existirem'+(nm?' (perfil "'+esc(nm)+'", '+esc(pts)+' pontos)':'')+'. Eles são seus?</p></div><div class="card"><p class="tip" style="margin:0">Se confirmar, eles passam a pertencer a esta conta e não serão oferecidos a nenhuma outra. Em qualquer caso, os dados originais continuam guardados no aparelho.</p></div><div class="row"><button class="btn" id="ad-y">Sim, usar nesta conta</button></div><div class="row"><button class="btn sec" id="ad-n">Não, começar do zero</button></div>');
 $("ad-y").onclick=function(){if(my!==gen)return;var r=CFStore.adopt(LS(),uid);
  if(r.ok){enter(uid);return}
  if(r.reason==="write"){alert("Não foi possível copiar os dados antigos para esta conta. Nada foi alterado.");return}
  enter(uid)};
 $("ad-n").onclick=function(){if(my!==gen)return;CFStore.decline(LS(),uid);S=CF.emptyState();renderOb()}}

/* ---------- Backup ---------- */
function exportText(t,name){var b=new Blob([t],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
/* A importação vale só para a conta que estava ativa ao escolher o arquivo; se a conta mudar, o resultado é descartado. */
function pickImport(onDone){var my=gen,uid=curUid;if(!uid)return;var i=document.createElement("input");i.type="file";i.accept="application/json,.json";i.onchange=function(){var f=i.files[0];if(!f)return;if(f.size>1000000){alert("Arquivo grande demais (máximo 1 MB).");return}
 var rd=new FileReader();rd.onerror=function(){alert("Não foi possível ler o arquivo.")};rd.onload=function(){if(my!==gen)return;var r=CF.parseBackup(String(rd.result));if(!r.ok){alert("Backup recusado:\n- "+r.errors.slice(0,5).join("\n- ")+"\n\nNenhum dado foi alterado.");return}
  if(!confirm("Substituir os dados desta conta pelo backup? Uma cópia dos dados atuais será guardada neste aparelho."))return;
  if(my!==gen)return;
  try{localStorage.setItem(CFStore.key(uid)+":antes-importar",JSON.stringify(S))}catch(e){}
  S=r.state;blocked=false;loadErr=null;if(S.active)pauseActive();save();homeStale=false;if(onDone)onDone();S.profile?renderHome():renderOb()};rd.readAsText(f)};i.click()}
function renderRecovery(){view('<div class="hero"><h1>Não consegui carregar seus dados</h1><p>'+(bakOk?"Seus dados originais foram preservados e não foram apagados.":"Seus dados originais ainda não foram apagados, mas não coube uma cópia de segurança neste aparelho. Baixe a cópia abaixo antes de qualquer outra ação.")+'</p></div><div class="card"><b>O que foi encontrado:</b><ul>'+loadErr.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul></div><div class="row"><button class="btn" id="im">Restaurar de um backup</button></div><div class="row"><button class="btn sec" id="ex">Baixar cópia dos dados antigos</button></div><button class="link" id="fr">Começar do zero (a cópia antiga fica guardada)</button>');
 $("im").onclick=function(){pickImport()};$("ex").onclick=function(){exportText(rawBad||"","crowfit-dados-antigos.json")};
 $("fr").onclick=function(){if(confirm(bakOk?"Começar do zero? Os dados antigos continuam guardados em uma cópia neste aparelho.":"ATENÇÃO: não foi possível guardar uma cópia dos dados antigos neste aparelho. Se continuar, eles serão apagados. Use antes \"Baixar cópia dos dados antigos\". Começar do zero mesmo assim?")){blocked=false;loadErr=null;S=CF.emptyState();save();renderOb()}}}

/* ---------- Onboarding ---------- */
var QS=[
{k:"nome",q:"Como podemos te chamar?",type:"text",ph:"Seu nome"},
{k:"idade",q:"Quantos anos você tem?",type:"number",ph:"Idade",min:12,max:90},
{k:"peso",q:"Quanto você pesa (kg)?",type:"number",ph:"Peso em kg",min:30,max:250},
{k:"altura",q:"Qual é a sua altura (cm)?",type:"number",ph:"Altura em cm",min:120,max:230},
{k:"exp",q:"Qual é a sua experiência com exercícios?",type:"chips",o:CF.EXP},
{k:"dias",q:"Quantos dias por semana quer treinar?",type:"chips",o:["3","4","5","6"]}];
function renderOb(){var s=ob.step;
 if(s===0&&!ob.started){view('<div class="hero pop">'+mascote(150)+'<img class="logo" src="logo.png" alt="Crowfit"><p>Treinos sem equipamento. Um dia de cada vez, com ofensiva e pontos.</p><p class="tip">O Crowfit não substitui avaliação profissional. Se sentir dor ou tontura, pare.</p></div><button class="btn" id="go">Começar</button>');$("go").onclick=function(){ob.started=1;renderOb()};return}
 var q=QS[s],pct=Math.round(s/QS.length*100),h='<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div><div class="center" style="margin:18px 0">'+mascote(80)+'</div><h2 class="center">'+q.q+'</h2><div style="margin-top:18px">';
 if(q.type==="chips")h+='<div class="chips" style="justify-content:center">'+q.o.map(function(o){return'<button class="chip'+(String(ob.d[q.k])===o?" on":"")+'" data-v="'+CF.escAttr(o)+'">'+esc(o)+'</button>'}).join("")+'</div>';
 else h+='<input id="in" type="'+q.type+'" inputmode="'+(q.type==="number"?"numeric":"text")+'" placeholder="'+CF.escAttr(q.ph)+'" '+(q.min?'min="'+q.min+'" max="'+q.max+'"':'maxlength="40"')+' aria-label="'+CF.escAttr(q.q)+'">';
 h+='</div><p id="err" class="center" role="alert" style="color:#E5484D;min-height:24px"></p><div class="row">'+(s>0?'<button class="btn sec" id="bk" style="width:40%">Voltar</button>':"")+'<button class="btn" id="nx">'+(s===QS.length-1?"Montar meu plano":"Continuar")+'</button></div>';
 view(h);
 if($("in")){$("in").value=ob.d[q.k]==null?"":String(ob.d[q.k]);$("in").focus()}
 document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){ob.d[q.k]=c.getAttribute("data-v");renderOb()}});
 if($("bk"))$("bk").onclick=function(){ob.step--;renderOb()};
 $("nx").onclick=function(){var v,E=$("err");
  if(q.type==="chips"){v=ob.d[q.k];if(v==null||v===""){E.textContent="Escolha uma opção.";return}}
  else{v=$("in").value.trim();if(!v){E.textContent="Preencha para continuar.";return}
   if(q.type==="number"){v=Number(v);if(!isFinite(v)||v<q.min||v>q.max||(q.k==="idade"&&!Number.isInteger(v))){E.textContent="Digite um valor entre "+q.min+" e "+q.max+".";return}}
   else if(v.length>40){E.textContent="Use no máximo 40 caracteres.";return}}
  ob.d[q.k]=v;
  if(s<QS.length-1){ob.step++;renderOb();return}
  var r=CF.validateProfile({nome:ob.d.nome,idade:ob.d.idade,peso:ob.d.peso,altura:ob.d.altura,exp:ob.d.exp,dias:Number(ob.d.dias)});
  if(!r.ok){E.textContent=r.errors[0];return}
  S.profile=r.profile;CF.setPlan(S,r.profile.dias,today());save();renderHome()}}

/* ---------- Home ---------- */
function lvlInfo(){return{l:Math.floor(S.points/200)+1,pct:(S.points%200)/200*100}}
function weekDates(){var n=new Date(),i=(n.getDay()+6)%7,m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i),a=[];for(var j=0;j<7;j++)a.push(new Date(m.getFullYear(),m.getMonth(),m.getDate()+j));return{dates:a,today:i}}
/* ---------- Trilha (home) ---------- */
/* O save do contexto só vale para a conta que estava ativa quando a tela foi montada. */
function trailCtx(){var g=gen;return{S:S,save:function(){return g===gen?save():false},say:say,esc:esc,today:today(),mascote:mascote,view:view,back:renderHome}}
function renderHome(){var li=lvlInfo(),t=today(),a=S.active,b4=S.streak+"/"+S.best;CF.refreshStreak(S,t);if(b4!==S.streak+"/"+S.best)save();
 var h='<div class="top" style="margin-bottom:8px"><div class="stat" title="Ofensiva atual">🔥 '+S.streak+'</div><div class="stat" title="Nível"><button type="button" class="pf" id="pf" aria-label="Abrir meu perfil">'+mascote(36)+'</button> Nv '+li.l+'</div><div class="stat" title="Pontos">⭐ '+S.points+'</div></div><div class="bar" role="img" aria-label="Progresso do nível"><i style="width:'+li.pct+'%;background:var(--gold)"></i></div><small style="color:var(--mute)">'+(200-S.points%200)+' pontos para o nível '+(li.l+1)+' · Melhor ofensiva: '+S.best+(S.best===1?" dia":" dias")+'</small>';
 if(a)h+='<div class="card" style="margin-top:12px"><b>Treino antigo em andamento</b><div>'+esc(SES[a.type].n)+' · exercício '+Math.min(a.exIdx+1,a.exercises.length)+' de '+a.exercises.length+'</div><div class="row"><button class="btn" id="rs">Retomar</button><button class="btn sec" id="ab">Abandonar</button></div></div>';
 h+='<div id="trail"></div>';
 view(h);
 if($("rs"))$("rs").onclick=function(){S.active.status="in_progress";renderEx()};
 if($("ab"))$("ab").onclick=function(){if(confirm("Abandonar este treino? As séries feitas ficam no histórico, mas sem bônus de conclusão.")){CF.abandonSession(S,S.active,Date.now());S.active=null;save();renderHome()}};
 if($("pf"))$("pf").onclick=function(){if(window.CrowfitProfile)CrowfitProfile.open($("pf"))};
 CFT.mount($("trail"),trailCtx())}

/* ---------- Configurações (renderizadas dentro do painel de perfil, categorias "Perfil de treino" e "Dados e backup") ---------- */
function secTrain(host,a){var p=S&&S.profile;
 if(!p){host.innerHTML='<p class="tip">Esta conta ainda não tem perfil de treino. Ele é criado no primeiro acesso.</p>';return}
 var d={exp:p.exp,dias:p.dias};
 function fld(id,lab,type,val,ex){return'<div class="cf-field"><label for="'+id+'">'+lab+'</label><input id="'+id+'" type="'+type+'" value="'+CF.escAttr(val)+'" '+ex+'></div>'}
 function chips(lab,id,at,list,cur){return'<div class="cf-field"><label id="'+id+'">'+lab+'</label><div class="chips" role="group" aria-labelledby="'+id+'">'+list.map(function(o){return'<button type="button" class="chip" '+at+'="'+CF.escAttr(o)+'" aria-pressed="false">'+esc(o)+'</button>'}).join("")+'</div></div>'}
 host.innerHTML='<form class="cf-form" novalidate id="tf">'+fld("tf-n","Nome","text",p.nome,'maxlength="40" autocomplete="given-name"')+fld("tf-i","Idade","number",p.idade,'inputmode="numeric" min="12" max="90"')+fld("tf-p","Peso (kg)","number",p.peso,'inputmode="decimal" step="any" min="30" max="250"')+fld("tf-h","Altura (cm)","number",p.altura,'inputmode="decimal" step="any" min="120" max="230"')+
  chips("Experiência com exercícios","tf-el","data-e",CF.EXP)+chips("Dias de treino por semana","tf-dl","data-d",[3,4,5,6])+
  '<p class="cf-msg" role="status" aria-live="polite" id="tf-m" hidden></p><button class="cf-btn cf-btn-main" type="submit">Salvar alterações</button></form>'+
  '<p class="cf-hint">Editar não apaga pontos, histórico, ofensiva nem a trilha. A experiência vale a partir da próxima seção da trilha; os dias por semana valem a partir de hoje.</p>'+
  '<button class="cf-btn cf-btn-ghost" type="button" id="tf-r">Refazer perfil e plano</button>';
 function mark(sel,at,val){host.querySelectorAll(sel).forEach(function(c){var on=c.getAttribute(at)===String(val);c.classList.toggle("on",on);c.setAttribute("aria-pressed",on?"true":"false")})}
 function m(t,ok){var n=host.querySelector("#tf-m");n.textContent=t||"";n.className="cf-msg "+(ok?"ok":"error");n.hidden=!t}
 mark("[data-e]","data-e",d.exp);mark("[data-d]","data-d",d.dias);
 host.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){d.exp=b.getAttribute("data-e");mark("[data-e]","data-e",d.exp)}});
 host.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){d.dias=Number(b.getAttribute("data-d"));mark("[data-d]","data-d",d.dias)}});
 host.querySelector("#tf").onsubmit=function(e){e.preventDefault();
  var g=function(id){return host.querySelector(id).value.trim()};
  var r=CF.validateProfile({nome:g("#tf-n"),idade:Number(g("#tf-i")),peso:Number(g("#tf-p")),altura:Number(g("#tf-h")),exp:d.exp,dias:d.dias});
  if(!r.ok){m(r.errors[0]);return}
  var old=S.profile,ph=JSON.stringify(S.planHistory),t=today();
  S.profile=r.profile;if(r.profile.dias!==old.dias)CF.setPlan(S,r.profile.dias,t);CF.refreshStreak(S,t);
  if(!save()){S.profile=old;S.planHistory=JSON.parse(ph);CF.refreshStreak(S,t);m("Não foi possível salvar. Nada foi alterado.");return}
  homeStale=true;m("Alterações salvas.",true)};
 host.querySelector("#tf-r").onclick=function(){
  if(S.active){alert("Termine ou abandone o treino em andamento antes de refazer o plano.");return}
  if(!confirm("Refazer o perfil? Seus pontos, histórico, ofensiva e trilha são mantidos."))return;
  var old=S.profile;S.profile=null;if(!save()){S.profile=old;alert("Não foi possível salvar. Nada foi alterado.");return}
  ob={step:0,d:{}};homeStale=false;a.close();renderOb()}}
function secData(host,a){
 host.innerHTML='<div class="card"><b>O que o backup inclui</b><ul class="cf-ul"><li>Perfil de treino (nome, idade, peso, altura, experiência e dias por semana)</li><li>Pontos, nível e ofensiva</li><li>Histórico de treinos e de planos</li><li>Progresso da trilha</li><li>Ajuste de dificuldade</li></ul><p class="tip" style="margin:8px 0 0">Não inclui e-mail, senha nem o nome de exibição da conta. O arquivo tem dados pessoais: guarde com cuidado.</p></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn sec" type="button" id="d-x">Exportar backup</button></div><div class="row"><button class="btn sec" type="button" id="d-i">Importar backup</button></div>'+
  '<p class="cf-hint">Importar substitui os dados desta conta neste aparelho. Antes de substituir, pedimos confirmação e guardamos uma cópia dos dados atuais.</p>';
 host.querySelector("#d-x").onclick=function(){if(S)exportText(CF.makeBackup(S),"crowfit-backup-"+today()+".json")};
 host.querySelector("#d-i").onclick=function(){pickImport(function(){a.close()})}}

/* ---------- Treino ---------- */
function buildSession(type,lv){return SES[type].ex.map(function(k){var parts=k.split("|"),id=parts.length>1&&lv>=1?parts[1]:parts[0],e=EX[id],opt=(id==="po"||id==="al");
 return{id:id,n:e.n,t:e.t,val:e.v[lv],optional:opt,sets:opt?1:(lv===0?2:3),rest:lv===0?30:45}})}
function startSession(type){var lv=CF.levelFor(S.profile,S.adjust),t=today();S.active=CF.newSession(type,buildSession(type,lv),t,Date.now(),S.profile.dias,!!S.done[t]);save();renderEx()}
function cur(){var a=S.active;return a&&a.exercises[a.exIdx]}
function renderEx(){var a=S.active,ex=cur();if(!ex){finish();return}CF.syncStatus(ex);
 var pct=Math.round(a.exIdx/a.exercises.length*100),tip=EX[ex.exerciseId]?EX[ex.exerciseId].tip:"",T=ex.timer,n=ex.setIdx+1;
 var chips=ex.sets.map(function(s,i){var c=s.completed?" ok":(i===ex.setIdx&&!ex.restPending?" cur":"");return'<span class="sp'+c+'">'+(s.completed?"✓ ":"")+'Série '+(i+1)+'</span>'}).join("");
 var h='<div class="row" style="align-items:center;margin:0 0 20px"><button class="chip" id="x" aria-label="Sair do treino">✕</button><div class="bar" style="flex:1" role="img" aria-label="Progresso do treino"><i style="width:'+pct+'%"></i></div></div>';
 h+='<div class="card center pop"><div>'+mascote(70)+'</div><h2 style="margin-top:10px">'+esc(ex.name)+'</h2><p class="tip" style="margin:6px 0">Exercício '+(a.exIdx+1)+' de '+a.exercises.length+(ex.optional?" · opcional":"")+(a.extra?" · sessão extra":"")+'</p><div class="sets">'+chips+'</div>';
 if(ex.restPending){var rt=T&&T.kind==="rest";
  h+='<p><b>Descanso</b> antes da série '+n+' de '+ex.sets.length+'</p><div class="big" id="tg">'+(rt?CF.timerSecs(T):ex.rest)+'s</div>';
  if(!rt)h+='<button class="btn" id="rst">Iniciar descanso</button>';
  else h+='<button class="btn sec" id="'+(T.state==="paused"?"rsm":"pse")+'">'+(T.state==="paused"?"Retomar":"Pausar")+'</button>';
  h+='<button class="link" id="rsk" style="margin-top:14px">Pular descanso</button>'}
 else{h+='<p><b>Série '+n+' de '+ex.sets.length+'</b></p>';
  if(ex.kind==="s"){var st=T?T.state:"idle";h+='<div class="big" id="tg">'+(T?CF.timerSecs(T):ex.target)+'s</div>';
   if(st==="idle")h+='<button class="btn" id="ts">Iniciar série ('+ex.target+'s)</button>';
   else if(st==="running")h+='<button class="btn sec" id="pse">Pausar</button>';
   else if(st==="paused")h+='<button class="btn sec" id="rsm">Retomar</button>';
   h+='<button class="btn" id="ok" style="margin-top:12px" '+(st==="time_completed"?"":"disabled")+'>Concluir série '+n+' (+10 ao fim)</button>'}
  else h+='<div class="big">'+ex.target+' repetições</div><p class="tip">'+esc(tip)+'</p><button class="btn" id="ok">Concluí a série '+n+'</button>';
  if(ex.kind==="s")h+='<p class="tip">'+esc(tip)+'</p>';
  h+='<button class="link" id="sk" style="margin-top:14px">Pular exercício</button>'}
 h+='<p class="tip" style="font-size:13px">Sentiu dor ou tontura? Pare e procure orientação profissional.</p></div>';
 view(h);
 var B=function(id,f){var e=$(id);if(e)e.onclick=function(){if(act())f()}};
 B("x",function(){if(confirm("Sair e continuar depois? Seu progresso fica salvo.")){a.status="interrupted";persist();renderHome()}});
 B("ts",function(){ex.timer=CF.timerStart(ex.target,"work",Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("pse",function(){CF.timerPause(ex.timer,Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("rsm",function(){CF.timerResume(ex.timer,Date.now());CF.syncStatus(ex);persist();renderEx()});
 B("rst",function(){ex.timer=CF.timerStart(ex.rest,"rest",Date.now());persist();renderEx()});
 B("rsk",function(){ex.restPending=false;ex.timer=null;CF.syncStatus(ex);persist();say("Descanso pulado");renderEx()});
 B("ok",function(){var r=CF.completeSet(a,Date.now());if(!r.ok){say("Não foi possível concluir a série: "+({timer:"termine o tempo primeiro",rest:"faça o descanso ou pule-o"}[r.reason]||"ação inválida"));renderEx();return}
  if(r.exerciseDone){var p=CF.grantExercise(S,a,ex);say("Exercício concluído"+(p?". +"+p+" pontos":". Sem novos pontos"));next()}else{persist();say("Série concluída");renderEx()}});
 B("sk",function(){CF.skipExercise(a);say("Exercício pulado");next()});
 if(T&&T.state==="running")loop()}
function next(){var fin=CF.advance(S.active);persist();fin?finish():renderEx()}
function loop(){clearInterval(tm);var g0=gen;tm=setInterval(function(){if(g0!==gen||!S){clearInterval(tm);return}var ex=cur();if(!ex||!ex.timer||ex.timer.state!=="running")return;CF.timerTick(ex.timer,Date.now());
 if(ex.timer.state==="time_completed"){clearInterval(tm);if(ex.timer.kind==="rest"){ex.restPending=false;ex.timer=null;say("Descanso terminado")}else say("Tempo concluído. Conclua a série.");CF.syncStatus(ex);persist();renderEx()}
 else{var g=$("tg");if(g)g.textContent=CF.timerSecs(ex.timer)+"s"}},250)}
function finish(){var a=S.active,st=CF.finishSession(S,a,Date.now(),today());S.active=null;save();var ok=st==="completed";
 view('<div class="hero pop">'+mascote(150)+'<h1>'+(ok?"Treino concluído!":"Treino encerrado")+'</h1><p>'+(ok?"Você completou todos os exercícios obrigatórios.":"Há exercícios obrigatórios pendentes: sem bônus de treino completo e o dia não conta para a ofensiva.")+'</p></div><div class="card center"><div class="big" style="color:var(--gold)">+'+a.points+'</div><div>pontos nesta sessão'+(a.extra?" (sessão extra)":"")+'</div><div style="margin-top:14px;font-family:Fredoka;font-size:22px">🔥 Ofensiva: '+S.streak+(S.streak===1?" dia":" dias")+'</div></div>'+
 (ok?'<div class="card center" style="margin-top:14px"><b>Como foi o treino?</b><div class="chips" style="justify-content:center;margin-top:10px"><button class="chip" data-f="hard">Foi difícil</button><button class="chip" data-f="ok">No ponto</button><button class="chip" data-f="easy">Foi fácil</button></div><p class="tip" id="fm"></p></div>':"")+'<div style="margin-top:18px"><button class="btn" id="hm">Voltar ao plano</button></div>');
 document.querySelectorAll("[data-f]").forEach(function(c){c.onclick=function(){if(a.feedback)return;a.feedback=c.getAttribute("data-f");CF.applyFeedback(S,a.feedback);save();document.querySelectorAll("[data-f]").forEach(function(x){x.classList.toggle("on",x===c);x.disabled=true});$("fm").textContent=a.feedback==="hard"?"Anotado. O próximo treino fica mais leve.":a.feedback==="easy"?"Anotado. Subimos a dificuldade depois de 3 treinos fáceis seguidos.":"Anotado."}});
 $("hm").onclick=renderHome}

/* ---------- Início ---------- */
/* Nada é carregado aqui: os dados só são lidos depois que a autenticação informa o UID (boot). */
if(window.CrowfitProfile){
 /* Perfil lê nível e XP daqui (mesma fonte da home: S.points e lvlInfo). Sem conta carregada, devolve null. */
 CrowfitProfile.setStats(function(){return S&&S.profile?{level:lvlInfo().l,points:S.points}:null});
 CrowfitProfile.setSections(function(name,host,api){if(!S)return;if(name==="train")secTrain(host,api);else if(name==="data")secData(host,api)});
 CrowfitProfile.setOnClose(function(){if(homeStale&&S&&S.profile){homeStale=false;renderHome()}})}
if(window.CrowfitAuth){CrowfitAuth.onChange(boot);CrowfitAuth.init().then(function(){boot(CrowfitAuth.getState())})}
else view('<div class="hero"><h1>Não foi possível iniciar</h1><p>O módulo de acesso não carregou. Recarregue a página.</p></div>');
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(e){console.warn("Crowfit: service worker não registrado",e)})})}
</script>
