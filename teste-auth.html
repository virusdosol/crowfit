<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de autenticação — Crowfit</title>
<link rel="stylesheet" href="auth/auth.css">
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
  <h1>Crowfit — página de teste</h1>
  <p>Esta página simula o app. Se você está vendo isto sem a tela de login, há uma sessão ativa.</p>
  <p id="who">Sem sessão.</p>
  <button data-crowfit-logout>Sair (teste)</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" async></script>
  <script src="auth/supabase-config.js"></script>
  <script src="auth/auth.js"></script>
  <script src="auth/auth-ui.js"></script>
  <script>
    window.addEventListener('crowfit:auth', function (e) {
      var u = e.detail.user;
      document.getElementById('who').textContent = u ? 'Logado como ' + u.email : 'Sem sessão.';
    });
  </script>
</body>
</html>
